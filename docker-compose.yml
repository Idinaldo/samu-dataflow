name: pulso192

services:
  db:
    image: postgres:16-alpine
    container_name: pulso192_postgres_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pulso192_network

  backend-api:
    image: pulso192:${API_IMAGE_TAG:-latest-linux-x64}
    container_name: pulso192_backend_api
    restart: on-failure
    ports:
      - "${API_HOST_PORT}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__PostgreSQLConnection: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      API_KEY: ${API_KEY}
      ORACLE_CONNECTION_STRING: ${ORACLE_CONNECTION_STRING}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pulso192_network

volumes:
  postgres_data:
    driver: local

networks:
  pulso192_network:
    driver: bridge
