name: pulso192

services:
  api:
    build:
      context: ./pulso192
      dockerfile: Dockerfile

    depends_on:
      - oracle-db
      - postgres-db

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

  postgres-db:
    image: postgres:16-alpine

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pulso192_db

    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  # lite pra não ter que baixar 1.6 GB em dev
  oracle-db:
    image: container-registry.oracle.com/database/free:23.26.4.0-lite

    environment:
      ORACLE_PWD: oracle

volumes:
  postgres_data:
