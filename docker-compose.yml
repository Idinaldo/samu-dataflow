name: pulso192

services:
  pulso192-api:
    build:
      context: ./pulso192
      dockerfile: Dockerfile

    depends_on:
      - oracle-db
      - postgres-db

    ports:
      - "8080:8080"

    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080

  postgres-db:
    image: postgres:16-alpine

    ports:
      - "5432:5432"

    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=pulso192_db

    volumes:
      - postgres_data:/var/lib/postgresql/data

  oracle-db:
    image: container-registry.oracle.com/database/free:latest

    ports:
      - "1521:1521"

    environment:
      - ORACLE_PWD=oracle

volumes:
  postgres_data:
