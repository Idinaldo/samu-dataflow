name: pulso192

services:
  api:
    build:
      context: ./pulso192
      dockerfile: Dockerfile

    depends_on:
      - oracle-db
      - postgres-db

    ports:
      - "8080:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080

  postgres-db:
    image: postgres:16-alpine
    
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

  # mudar para a versão do cliente antes de subir em prod
  oracle-db:
    image: container-registry.oracle.com/database/free:23.26.4.0-lite

    environment:
      ORACLE_PWD: ${ORACLE_PASSWORD}

volumes:
  postgres_data:
